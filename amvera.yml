meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"  # укажите вашу версию Python
build:
  requirementsPath: requirements.txt
run:
  persistenceMount: /data
  containerPort: 8000
  command: python manage.py migrate && python create_superuser.py && gunicorn jiva.wsgi:application --bind 0.0.0.0:8000