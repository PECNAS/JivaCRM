{% load static %}
{% with current=request.resolver_match.url_name %}
<nav class="mob-tabbar" id="mobTabbar" aria-label="Основная навигация">
    <a href="{% url 'employees' %}" class="mob-tabbar__a{% if current == 'employees' %} is-on{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.4 2.7-5.6 6-5.6s6 2.2 6 5.6"/><path d="M17 11a3 3 0 100-6"/></svg>
        <span>Сотрудники</span>
    </a>
    <a href="{% url 'clients' %}" class="mob-tabbar__a{% if current == 'clients' %} is-on{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Клиенты</span>
    </a>
    <a href="{% url 'schedule' %}" class="mob-tabbar__a{% if current == 'schedule' %} is-on{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span>Расписание</span>
    </a>
    <a href="{% url 'tasks' %}" class="mob-tabbar__a{% if current == 'tasks' %} is-on{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8.5 9.5h7M8.5 13.5h4"/></svg>
        <span>Задачи</span>
        <span class="mob-tabbar__badge" id="mobTasksBadge" hidden></span>
    </a>
    {% if user.employee_profile.can_manage_money %}
    <a href="{% url 'money' %}" class="mob-tabbar__a{% if current == 'money' %} is-on{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.6"/><path d="M7 9.5v6M17 9.5v6"/></svg>
        <span>Деньги</span>
    </a>
    {% else %}
    <a href="{% url 'profile' %}" class="mob-tabbar__a{% if current == 'profile' %} is-on{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.7 3.3-6 7.5-6s7.5 2.3 7.5 6"/></svg>
        <span>Профиль</span>
    </a>
    {% endif %}
</nav>
{% endwith %}
