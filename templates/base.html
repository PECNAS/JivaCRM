<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>JIVA CRM · {% block title %}Главная{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="icon" href="{% static 'images/icon.jpg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">

    {% block css %}
    {% endblock css %}
</head>
<body>
    <header class="navbar">
        <div class="container navbar__container">
            <div class="navbar__brand">
                <span class="brand__icon"></span>
                <span class="brand__name">JIVA·CRM</span>
            </div>
            <nav class="navbar__menu" id="mainMenu">
                <ul class="menu__list">
                    <li class="menu__item"><a href="{% url 'index' %}" class="menu__link active">Главная</a></li>
                    <li class="menu__item"><a href="{% url 'schedule' %}" class="menu__link">Расписание</a></li>
                    <li class="menu__item"><a href="{% url 'employees' %}" class="menu__link">Сотрудники</a></li>
                    <li class="menu__item"><a href="{% url 'orders' %}" class="menu__link">Заказы</a></li>
                    <li class="menu__item"><a href="{% url 'clients' %}" class="menu__link">Клиенты</a></li>
                    <li class="menu__item"><a href="{% url 'reports' %}" class="menu__link">Отчёты</a></li>
                </ul>
            </nav>
            <div class="navbar__actions">
                <span class="user-badge">А. Аршинова</span>
                <button class="menu-toggle" id="menuToggle" aria-label="Открыть меню">
                    <span class="toggle-line"></span>
                    <span class="toggle-line"></span>
                    <span class="toggle-line"></span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}
            {% endblock content %}
        </div>
    </main>

    <footer class="footer">
        <div class="container footer__container">
            <p class="footer__copy">© 2026 JIVA · CRM v0.1</p>
            <p class="footer__meta">UI/UX — простота и ясность</p>
        </div>
    </footer>

    <script src="{% static 'js/base.js' %}"></script>
    {% block js %}
    {% endblock js %}
</body>
</html>
