{% extends "base.html" %}
{% load static %}

{% block title %}Деньги{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/money.css' %}">
<link rel="stylesheet" href="{% static 'css/money-payouts.css' %}">
{% endblock %}

{% block content %}
<div class="money-layout">
    <aside class="money-sidebar js-sidebar">
        <h1 class="money-title">Деньги</h1>

        <div class="money-tabs" role="tablist">
            <button class="money-tab active" type="button" data-tab="shows" role="tab">Заказы</button>
            <button class="money-tab" type="button" data-tab="payouts" role="tab">Выплаты</button>
            <button class="money-tab" type="button" data-tab="history" role="tab">История выплат</button>
        </div>

        <form class="money-searchbar" id="moneySearchForm" autocomplete="off">
            <input type="text" class="money-filter__input money-searchbar__input" id="moneySearch" placeholder="Поиск сотрудника: имя или ФИО">
        </form>

        <div class="money-filters" id="moneyFilters">
            <label class="money-filter">
                <span class="money-filter__label">Статус</span>
                <select class="form-select money-filter__control" id="moneyStatusFilter">
                    <option value="all">Все статусы</option>
                    {% for key, label in statuses %}
                    <option value="{{ key }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </label>

            <div class="money-filter">
                <span class="money-filter__label">Дата</span>
                <div class="money-filter__range">
                    <label class="money-filter__row">
                        <span class="money-filter__caption">От</span>
                        <input type="date" class="form-input money-filter__input" id="moneyDateFrom">
                    </label>
                    <label class="money-filter__row">
                        <span class="money-filter__caption">До</span>
                        <input type="date" class="form-input money-filter__input" id="moneyDateTo">
                    </label>
                </div>
            </div>

            <label class="money-filter">
                <span class="money-filter__label">Сортировка</span>
                <select class="form-select money-filter__control" id="moneySortFilter">
                    <option value="date_asc">Сначала старые</option>
                    <option value="date_desc">Сначала новые</option>
                </select>
            </label>
        </div>

        <div class="money-filters money-filters--payouts" id="moneyPayoutFilters" hidden></div>
    </aside>

    <section class="money-content">
        <div class="money-panel active" id="moneyPanelShows">
            <div class="money-shows" id="moneyShowsList">
                <div class="money-loading">Загрузка...</div>
            </div>
        </div>
        <div class="money-panel" id="moneyPanelPayouts">
            <div class="money-payouts-frame">
                <div class="money-payouts-panel" id="moneyPayoutsMount"></div>
            </div>
        </div>
        <div class="money-panel" id="moneyPanelHistory">
            <div class="money-payouts-panel" id="moneyHistoryMount"></div>
        </div>
    </section>
</div>
{% endblock %}

{% block js %}
<script src="{% static 'js/money.js' %}"></script>
<script src="{% static 'js/money-payouts.js' %}"></script>
{% endblock %}
