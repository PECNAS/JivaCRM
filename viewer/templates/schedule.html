{% extends "base.html" %}
{% load static %}

{% block title %}Расписание{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/schedule.css' %}">
{% endblock %}

{% block content %}
<section class="schedule-container">
    <div class="schedule-controls">
        <div class="schedule-controls__left">
            <div class="status-filters">
                <button class="status-filter-btn active" data-status="all">Все</button>
                <button class="status-filter-btn" data-status="request">Запрос</button>
                <button class="status-filter-btn" data-status="confirmed">Подтверждено</button>
                <button class="status-filter-btn" data-status="completed">Выполнено</button>
                <button class="status-filter-btn" data-status="training">Тренировки</button>
            </div>
        </div>
        <div class="schedule-controls__right">
            <div class="schedule-search">
                <input type="text" class="schedule-search__input" id="scheduleSearch" placeholder="Поиск по клиенту или адресу">
                <svg class="schedule-search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <div class="view-controls">
                <button class="view-btn active" data-view="month">Месяц</button>
                <button class="view-btn" data-view="week">Неделя</button>
                <button class="view-btn" data-view="day">День</button>
                <button class="view-btn" data-view="today">Сегодня</button>
            </div>
        </div>
    </div>

    <div class="schedule-header">
        <button class="schedule-nav" id="prevPeriod">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2 class="schedule-title" id="scheduleTitle">Месяц</h2>
        <button class="schedule-nav" id="nextPeriod">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
    </div>

    <div class="schedule-grid-wrapper">
        <div class="schedule-grid" id="scheduleGrid"></div>
    </div>
</section>

<div class="modal-overlay" id="orderModal">
    <div class="modal modal--order">
        <div class="modal__header">
            <h2 class="modal__title" id="modalOrderTitle">Заказ</h2>
            <button class="modal__close" id="modalCloseBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div class="modal__body">
            <div class="order-details">
                <div class="details-grid">
                    <div class="detail-item"><span class="detail-label">Адрес:</span><span class="detail-value" id="viewAddress">—</span></div>
                    <div class="detail-item"><span class="detail-label">Дата:</span><span class="detail-value" id="viewDate">—</span></div>
                    <div class="detail-item"><span class="detail-label">Клиент:</span><span class="detail-value" id="viewClient">—</span></div>
                    <div class="detail-item"><span class="detail-label">Стоимость:</span><span class="detail-value" id="viewCost">—</span></div>
                    <div class="detail-item"><span class="detail-label">Статус:</span><span class="detail-value" id="viewStatus">—</span></div>
                    <div class="detail-item"><span class="detail-label">Менеджер:</span><span class="detail-value" id="viewManager">—</span></div>
                </div>
                <div class="order-actions">
                    <button class="btn btn-outline" id="viewOrderBtn">Перейти к заказу</button>
                    <button class="btn btn-primary" id="closeModalBtn">Закрыть</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
{% endblock %}

{% block js %}
<script src="{% static 'js/schedule.js' %}"></script>
{% endblock %}
