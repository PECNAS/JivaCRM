<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIVA HUB · Заказ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-nav">
    <a class="app-brand" href="#"><span class="app-brand__icon"></span><span class="app-brand__name">JIVA·HUB</span></a>
    <nav class="app-menu">
        <span>Расписание</span><span>Клиенты</span><span>Сотрудники</span><span>Услуги</span><span>Деньги</span><span>Отчёты</span>
    </nav>
    <div class="app-user">DHS</div>
</header>

<main class="stage">

    <div class="modal" role="dialog" aria-label="Новый заказ">

        <div class="modal__body">

            <section class="write">
                <div class="write__scroll" id="writeScroll">
                    <div class="card" id="editCard">
                        <div class="card__title" id="editTitle" contenteditable="true" data-ph="Название заказа"></div>

                        <div class="card__clips" id="editClips"></div>

                        <div class="card__rows" id="editRows"></div>

                        <div class="card__note">
                            <div class="card__note-label">Комментарий заказа</div>
                            <div class="card__note-body" id="editNote" contenteditable="true" data-ph="Добавить комментарий"></div>
                        </div>

                        <button type="button" class="add-field" id="addField">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                            Добавить поле
                        </button>
                    </div>
                </div>
            </section>

            <section class="preview">
                <div class="modal-head">
                    <div class="modal-head__title" id="viewHeadTitle">Заказ</div>
                    <button type="button" class="modal-head__x" title="Закрыть">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>

                <div class="ev-body" id="viewBody">
                    <div class="ev-head">
                        <div class="ev-head__date" id="viewDate"></div>
                        <span class="ev-status" id="viewStatus">Запрос</span>
                    </div>

                    <div class="ev-client" id="viewClient"></div>
                    <div class="ev-lines" id="viewLines"></div>

                    <div class="ev-section">СОТРУДНИКИ</div>
                    <div id="viewStaff"></div>

                    <div class="ev-section">ОРГАНИЗАЦИЯ</div>
                    <div class="ev-boxes" id="viewBoxes"></div>

                    <div id="viewExtra"></div>
                </div>

                <div class="ev-foot">
                    <div class="ev-foot__row">
                        <button type="button" class="btn btn-outline">Закрыть</button>
                        <button type="button" class="btn btn-outline" id="copyLinkBtn">Копировать ссылку</button>
                        <button type="button" class="btn btn-outline" id="checklistBtn">Чек-лист <span class="ev-count">—</span></button>
                    </div>
                    <div class="ev-foot__row">
                        <button type="button" class="btn btn-primary" id="moreBtn">Подробнее</button>
                    </div>
                </div>
            </section>

        </div>

        <footer class="modal__foot">
            <span class="foot__count" id="fieldCount"></span>
            <div class="foot-right">
                <button type="button" class="btn btn-outline" id="clearBtn">Очистить</button>
                <button type="button" class="btn btn-outline">Отмена</button>
                <button type="button" class="btn btn-primary" id="saveBtn">Сохранить</button>
            </div>
        </footer>

    </div>

</main>

<div class="pop" id="pop" hidden></div>
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
